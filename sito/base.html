<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ t("nome_progetto", "title") }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css">
</head>
<body data-pagina="{{ pagina }}">
<header class="testata">
  <a class="marchio" href="../home/index.html">{{ t("nome_progetto") }}</a>
  {% if d %}
  <nav class="menu" aria-label="sezioni">
    <a href="index.html"{% if pagina == "index.html" %} aria-current="page"{% endif %}>{{ t("nav_classifica") }}</a>
    <a href="previsione.html"{% if pagina == "previsione.html" %} aria-current="page"{% endif %}>{{ t("nav_previsione") }}</a>
    <a href="giocatore.html"{% if pagina == "giocatore.html" %} aria-current="page"{% endif %}>{{ t("nav_giocatore") }}</a>
    <a href="metodo.html"{% if pagina == "metodo.html" %} aria-current="page"{% endif %}>{{ t("nav_metodo") }}</a>
  </nav>
  <span class="lega">{{ t("lega_" ~ d.lega) }}</span>
  {% endif %}
  <div class="lingua" role="group" aria-label="lingua / language">
    <button type="button" data-lingua="it">IT</button><button type="button" data-lingua="en">EN</button>
  </div>
</header>
<main>
{% block contenuto %}{% endblock %}
</main>
<footer class="piede">{{ t("piede", "p") }}</footer>
<script src="testi.js"></script>
<script src="dati.js"></script>
<script src="sito.js"></script>
</body>
</html>
